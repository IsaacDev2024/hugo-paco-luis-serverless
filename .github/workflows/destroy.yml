name: Destruir carga del laboratorio
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribe DESTRUIR-HPL para retirar la carga
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hpl-${{ github.ref }}
  cancel-in-progress: false
jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTRUIR-HPL'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_ACCOUNT: ${{ vars.TF_STATE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan y destrucción del laboratorio
        run: |
          set -euo pipefail
          mkdir -p evidence/destroy
          terraform -chdir=infra init -input=false -lockfile=readonly -backend-config="storage_account_name=$TF_STATE_ACCOUNT" -backend-config="container_name=$TF_STATE_CONTAINER" -backend-config="key=dev.terraform.tfstate" -backend-config="use_azuread_auth=true" -backend-config="use_oidc=true"
          terraform -chdir=infra plan -destroy -input=false -var-file=../config/lab.tfvars -out=destroy.tfplan -no-color | tee evidence/destroy/plan.txt
          terraform -chdir=infra apply -input=false -no-color destroy.tfplan | tee evidence/destroy/apply.txt
          terraform -chdir=infra state list > evidence/destroy/remaining-state.txt
          test ! -s evidence/destroy/remaining-state.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: destruccion-${{ github.sha }}
          path: evidence/destroy/
          retention-days: 30
